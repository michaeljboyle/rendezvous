<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendezvous Simulator — Phone, Plot tab</title>
<!-- Static mockup: Phone, 390 × 844 — Plot tab. Visual reference only. docs/prompt.md (the spec) wins on any conflict. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F14}
a{color:#7C9CFF}a:hover{color:#A9BCFF}
button,input{font-family:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #0B0F14; color: #E6EDF3; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; display: flex; flex-direction: column">

  <header style="height: 52px; flex: 0 0 auto; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #243042; background: #121820">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C9CFF" stroke-width="1.6" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="5.5" transform="rotate(-25 12 12)"></ellipse><circle cx="12" cy="12" r="2.4" fill="#7C9CFF" stroke="none"></circle></svg>
    <button type="button" style="height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 6px; background: transparent; color: #E6EDF3; border: 0; font-size: 14px; font-weight: 600">1 · Phasing<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B98A9" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <span style="flex: 1 1 auto"></span>
    <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">T+01:05:00</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8B98A9">Rev 0.70</span>
    </div>
    <button type="button" aria-label="More" style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="#8B98A9" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
  </header>

  <div role="tablist" aria-label="View" style="flex: 0 0 auto; margin: 8px 16px; height: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; box-sizing: border-box; background: #121820; border: 1px solid #243042; border-radius: 8px">
    <button type="button" role="tab" aria-selected="false" style="background: transparent; color: #8B98A9; border: 0; border-radius: 6px; font-size: 13px">Orbits</button>
    <button type="button" role="tab" aria-selected="false" style="background: transparent; color: #8B98A9; border: 0; border-radius: 6px; font-size: 13px">LVLH</button>
    <button type="button" role="tab" aria-selected="true" style="background: #243042; color: #E6EDF3; border: 0; border-radius: 6px; font-size: 13px; font-weight: 600">Plot</button>
  </div>

  <section aria-label="Rendezvous plot" style="flex: 0 0 auto; background: #121820; border-top: 1px solid #243042; border-bottom: 1px solid #243042">
    <div style="height: 40px; box-sizing: border-box; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600">Rendezvous plot</h2>
      <span style="font-size: 11.5px; color: #8B98A9">+V ← · +R ↑</span>
      <span style="flex: 1 1 auto"></span>
      <button type="button" style="height: 28px; padding: 0 9px; background: #1A2230; color: #FFB74D; border: 1px solid #3A4A5F; border-radius: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px">Auto · R ×5.0</button>
      <button type="button" aria-label="Fit view" style="width: 40px; height: 40px; display: grid; place-items: center; background: transparent; border: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B98A9" stroke-width="1.8" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path></svg></button>
    </div>
    <svg width="390" height="300" viewBox="0 0 390 300" role="img" aria-label="Chaser trajectory from 493 km behind and 70 km below to 5 km behind the Target; now 29 km behind, 42 km below" style="display: block" font-family="IBM Plex Mono, monospace">
      <g stroke="#1C2633" stroke-width="1">
        <line x1="85.5" y1="14" x2="85.5" y2="272"></line><line x1="149.8" y1="14" x2="149.8" y2="272"></line><line x1="214.1" y1="14" x2="214.1" y2="272"></line><line x1="278.5" y1="14" x2="278.5" y2="272"></line><line x1="342.8" y1="14" x2="342.8" y2="272"></line>
        <line x1="16" y1="97.8" x2="346" y2="97.8"></line><line x1="16" y1="162.3" x2="346" y2="162.3"></line><line x1="16" y1="226.8" x2="346" y2="226.8"></line>
      </g>
      <line x1="16" y1="33.4" x2="346" y2="33.4" stroke="#3A4A5F" stroke-width="1.25"></line>
      <line x1="21.1" y1="14" x2="21.1" y2="272" stroke="#3A4A5F" stroke-width="1.25"></line>
      <line x1="16" y1="33.4" x2="346" y2="33.4" stroke="#FFB74D" stroke-opacity="0.8" stroke-width="1.25" stroke-dasharray="2 4"></line>
      <line x1="16" y1="259.1" x2="346" y2="259.1" stroke="#FFB74D" stroke-opacity="0.8" stroke-width="1.25" stroke-dasharray="2 4"></line>
      <text x="344" y="27" text-anchor="end" font-size="10.5" fill="#FFB74D">Ap 420.0</text>
      <text x="344" y="253" text-anchor="end" font-size="10.5" fill="#FFB74D">Pe 350.0</text>
      <g font-size="10.5" fill="#8B98A9">
        <text x="21.1" y="290" text-anchor="middle">0</text><text x="85.5" y="290" text-anchor="middle">−100</text><text x="149.8" y="290" text-anchor="middle">−200</text><text x="214.1" y="290" text-anchor="middle">−300</text><text x="278.5" y="290" text-anchor="middle">−400</text><text x="342.8" y="290" text-anchor="middle">−500</text>
        <text x="352" y="37">0</text><text x="352" y="101.5">−20</text><text x="352" y="166">−40</text><text x="352" y="230.5">−60</text><text x="352" y="270">km</text>
      </g>
      <path d="M338.4 259.1 L333.8 259.1 L329.2 259.1 L324.5 259.1 L319.9 259.1 L315.3 259.1 L310.7 259.1 L306.0 259.1 L301.4 259.1 L296.8 259.1 L292.2 259.1 L287.5 259.1 L282.9 259.1 L278.3 259.1 L273.7 259.1 L269.1 259.1 L264.4 259.1 L259.8 259.1 L255.2 259.1 L250.6 259.1 L245.9 259.1 L241.3 259.1 L236.7 259.1 L232.1 259.1 L227.4 259.1 L222.8 259.1 L218.2 259.1 L213.6 259.1 L208.9 259.1 L204.3 259.1 L199.7 259.1 L195.1 259.1 L190.4 259.1 L185.8 259.1 L181.2 259.1 L176.6 259.1 L171.9 259.1 L167.3 259.1 L162.7 259.1 L158.1 259.1 L153.4 259.1 L148.8 259.1 L144.2 259.1 L139.6 259.1 L134.9 259.1 L130.3 259.1 L124.9 258.8 L119.5 258.0 L114.2 256.7 L108.9 254.9 L103.6 252.6 L98.4 249.7 L93.4 246.4 L88.4 242.6 L83.5 238.4 L78.7 233.7 L74.1 228.6 L69.6 223.1 L65.3 217.3 L61.1 211.2 L57.1 204.7 L53.3 198.0 L49.7 191.0 L46.3 183.9 L43.1 176.5 L40.0 169.0" fill="none" stroke="#FFB74D" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M40.0 169.0 L37.2 161.5 L34.6 153.8 L32.2 146.1 L30.0 138.4 L28.1 130.8 L26.3 123.2 L24.7 115.8 L23.4 108.5 L22.2 101.3 L21.2 94.4 L20.4 87.7 L19.8 81.3 L19.4 75.2 L19.1 69.4 L19.0 64.0 L19.0 58.9 L19.1 54.3 L19.4 50.0 L19.7 46.3 L20.2 42.9 L20.7 40.1 L21.4 37.7 L22.0 35.9 L22.8 34.5 L23.5 33.7 L24.3 33.4 L24.4 33.4" fill="none" stroke="#FFB74D" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4"></path>
      <g fill="#8B98A9">
        <circle cx="292.2" cy="259.1" r="2"></circle><circle cx="245.9" cy="259.1" r="2"></circle><circle cx="199.7" cy="259.1" r="2.5" fill="#E6EDF3"></circle><circle cx="153.4" cy="259.1" r="2"></circle><circle cx="103.6" cy="252.6" r="2"></circle><circle cx="57.1" cy="204.7" r="2.5" fill="#E6EDF3"></circle><circle cx="28.1" cy="130.8" r="2"></circle><circle cx="19.0" cy="64.0" r="2"></circle>
      </g>
      <text x="199.7" y="250" text-anchor="middle" font-size="10.5" fill="#8B98A9">T+0:30</text>
      <text x="66" y="209" font-size="10.5" fill="#8B98A9">T+1:00</text>
      <path d="M130.3 252.1 L136.3 263.1 L124.3 263.1 Z" fill="#FF5C7A"></path>
      <text x="138" y="275" font-size="11" fill="#E6EDF3">1 Transfer</text>
      <path d="M24.4 26.4 L30.4 37.4 L18.4 37.4 Z" fill="#121820" stroke="#FF5C7A" stroke-width="1.5"></path>
      <text x="36" y="52" font-size="11" fill="#E6EDF3">2 Circularize</text>
      <rect x="17.1" y="29.4" width="8" height="8" fill="#4FC3F7" stroke="#121820" stroke-width="1.5"></rect>
      <circle cx="40.0" cy="169.0" r="6" fill="#FFB74D" stroke="#121820" stroke-width="2.5"></circle>
      <text x="52" y="173" font-size="11.5" fill="#E6EDF3">Now</text>
    </svg>
  </section>

  <div style="flex: 0 0 auto; box-sizing: border-box; padding: 10px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-family: 'IBM Plex Mono', monospace">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 10.5px; color: #8B98A9">Range</span><span style="font-size: 14px">51.26 km</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 10.5px; color: #8B98A9">Range rate</span><span style="font-size: 14px">−74.96 m/s</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 10.5px; color: #8B98A9">Next burn</span><span style="font-size: 14px">26:08</span></div>
  </div>

  <div style="flex: 1 1 auto"></div>

  <div style="flex: 0 0 auto; box-sizing: border-box; padding: 8px 16px 10px; background: #121820; border-top: 1px solid #243042">
    <div style="position: relative; height: 28px">
      <div style="position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: #243042"></div>
      <div style="position: absolute; left: 0; width: 43.3%; top: 12px; height: 4px; border-radius: 2px; background: #FFB74D"></div>
      <div style="position: absolute; left: 30%; top: 5px; width: 3px; height: 18px; margin-left: -1px; border-radius: 1px; background: #FF5C7A"></div>
      <div style="position: absolute; left: 60.8%; top: 5px; width: 3px; height: 18px; margin-left: -1px; border-radius: 1px; background: #FF5C7A"></div>
      <div aria-label="Current time" style="position: absolute; left: 43.3%; top: 4px; width: 20px; height: 20px; margin-left: -10px; border-radius: 10px; background: #E6EDF3; box-shadow: 0 0 0 3px #121820"></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
      <button type="button" style="height: 44px; min-width: 56px; padding: 0 10px; background: #1A2230; color: #E6EDF3; border: 1px solid #3A4A5F; border-radius: 22px; font-family: 'IBM Plex Mono', monospace; font-size: 13px">120×</button>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="Previous burn" style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6EDF3" stroke-width="1.8" aria-hidden="true"><path d="M19 5L9 12l10 7z"></path><path d="M5 5v14"></path></svg></button>
        <button type="button" aria-label="Pause" style="width: 56px; height: 56px; display: grid; place-items: center; background: #7C9CFF; border: 0; border-radius: 28px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#0B0F14" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
        <button type="button" aria-label="Next burn" style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6EDF3" stroke-width="1.8" aria-hidden="true"><path d="M5 5l10 7-10 7z"></path><path d="M19 5v14"></path></svg></button>
      </div>
      <button type="button" aria-label="Restart" style="width: 56px; height: 44px; display: grid; place-items: center; background: transparent; border: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B98A9" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
    </div>
  </div>

  <section aria-label="Burns" style="flex: 0 0 auto; background: #1A2230; border-top: 1px solid #3A4A5F; border-radius: 14px 14px 0 0; box-sizing: border-box; padding: 6px 16px 16px">
    <div aria-hidden="true" style="width: 36px; height: 4px; margin: 0 auto 8px; border-radius: 2px; background: #3A4A5F"></div>
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 600">Burns</h2>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8B98A9">2 · 39.73 m/s</span>
      <span style="flex: 1 1 auto"></span>
      <button type="button" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 6px; background: transparent; color: #E6EDF3; border: 1px solid #3A4A5F; border-radius: 18px; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E6EDF3" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Burn</button>
    </div>
    <button type="button" style="width: 100%; height: 48px; display: grid; grid-template-columns: 28px 1fr auto auto; align-items: center; gap: 10px; padding: 0; background: transparent; color: #E6EDF3; border: 0; border-bottom: 1px solid #243042; text-align: left">
      <span style="display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; border-radius: 4px; background: #FF5C7A; color: #0B0F14; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500">1</span>
      <span style="font-size: 14px">Transfer</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8B98A9">T+00:45:00</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; min-width: 68px; text-align: right">19.89 m/s</span>
    </button>
    <button type="button" style="width: 100%; height: 48px; display: grid; grid-template-columns: 28px 1fr auto auto; align-items: center; gap: 10px; padding: 0; background: transparent; color: #E6EDF3; border: 0; text-align: left">
      <span style="display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; border-radius: 4px; border: 1.5px solid #FF5C7A; box-sizing: border-box; color: #FF5C7A; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500">2</span>
      <span style="font-size: 14px">Circularize</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8B98A9">T+01:31:08</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; min-width: 68px; text-align: right">19.84 m/s</span>
    </button>
  </section>
</div>
</body>
</html>
